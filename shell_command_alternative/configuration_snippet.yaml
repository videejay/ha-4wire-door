# =============================================================================
# Home Assistant configuration: manual door opening GBF MR263C4 / ControlCam
# -----------------------------------------------------------------------------
# Add this to configuration.yaml (or merge into the respective sections if
# shell_command:/script: already exist).
#
# IMPORTANT:
#   * Deliberate MANUAL single action -- NO automation:, no schedule, no trigger.
#   * One call = one transaction. No retry.
#   * No door status is faked: "success" = only the device's protocol
#     acknowledgement (result=1), NOT "door is open". Therefore deliberately NO
#     lock-/binary_sensor entity with state -- only a stateless trigger (button).
#   * Credentials live in door_secrets.json (chmod 600), NOT here.
# =============================================================================

shell_command:
  # Calls the script. No secrets on the command line -- the script reads them
  # from door_secrets.json. Adjust the paths to your /config layout if needed.
  open_front_door: "python3 /config/door/door_unlock_ha.py"

script:
  open_front_door:
    alias: "Open front door (manual)"
    icon: mdi:door-open
    mode: single          # no parallel/multiple run
    max_exceeded: silent
    sequence:
      - service: shell_command.open_front_door
        response_variable: door_result
      - choose:
          - conditions: "{{ door_result.returncode == 0 }}"
            sequence:
              - service: persistent_notification.create
                data:
                  title: "Front door"
                  message: >-
                    Open command sent, the device reported protocol success
                    (result=1). Note: no independent confirmation that the door
                    is physically open.
        default:
          - service: persistent_notification.create
            data:
              title: "Front door -- ERROR"
              message: >-
                Opening failed (exit {{ door_result.returncode }}).
                {{ door_result.stderr }}

# -----------------------------------------------------------------------------
# Dashboard button (Lovelace): adds a button that triggers the script ONLY
# manually by a person. Add it to a dashboard card:
#
#   type: button
#   name: Open front door
#   icon: mdi:door-open
#   tap_action:
#     action: perform-action          # (older HA: action: call-service)
#     perform_action: script.open_front_door
#     # Optional, as protection against accidental taps:
#   hold_action:
#     action: none
# -----------------------------------------------------------------------------
