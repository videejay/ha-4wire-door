name: Release

# Automatically creates a normal (NOT marked as pre-release) GitHub release as
# soon as a tag of the form vX.Y.Z is pushed. HACS can only install normal
# releases -- which is why prerelease: false is set deliberately here.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
